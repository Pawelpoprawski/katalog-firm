# ============================================
# NGINX CONFIG - Katalog Firm
# ============================================
# Skopiuj do: /etc/nginx/sites-available/katalog-firm
# Włącz:      sudo ln -s /etc/nginx/sites-available/katalog-firm /etc/nginx/sites-enabled/
# Testuj:     sudo nginx -t
# Reload:     sudo systemctl reload nginx
# ============================================

# Frontend (Next.js)
server {
    listen 80;
    server_name katalog.TWOJA-DOMENA.ch www.katalog.TWOJA-DOMENA.ch;
    
    # Przekierowanie na HTTPS (odkomentuj po uzyskaniu certyfikatu)
    # return 301 https://$server_name$request_uri;
    
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Backend API
server {
    listen 80;
    server_name api.katalog.TWOJA-DOMENA.ch;
    
    location / {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================
# PO SKONFIGUROWANIU - UZYSKAJ CERTYFIKAT SSL:
# sudo certbot --nginx -d katalog.TWOJA-DOMENA.ch -d www.katalog.TWOJA-DOMENA.ch -d api.katalog.TWOJA-DOMENA.ch
# ============================================
